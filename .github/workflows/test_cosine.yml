name: COSINE Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run COSINE Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            pandas \
            scipy \
            openpyxl \
            paramiko \
            tabulate \
            pytest \
            pytest-mock

      - name: Run COSINE unit tests
        run: |
          pytest COSINE/tests/ -v --tb=short
